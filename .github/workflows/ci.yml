name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .
      - name: Tests
        run: uv run --python ${{ matrix.python }} python -m unittest discover -s tests -v
