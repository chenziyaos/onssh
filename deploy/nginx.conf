# Example: serve onssh under https://ssh.example.com/ with HTTP basic auth.
# onssh itself runs on the same host: python -m onssh --address 127.0.0.1 --port 8000
# Put this server block inside the http {} block of your nginx configuration.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name ssh.example.com;

    ssl_certificate     /etc/ssl/ssh.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/ssh.example.com/privkey.pem;

    # onssh has no login of its own: anyone who reaches it can try SSH logins
    auth_basic           "onssh";
    auth_basic_user_file /etc/nginx/onssh.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # onssh compares the WebSocket Origin with Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep idle terminals open
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
