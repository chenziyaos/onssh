[project]
name = "onssh"
version = "1.0.0"
description = "SSH terminal in the browser (tornado + paramiko)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
    "tornado>=6.4",
]

[project.scripts]
onssh = "onssh.__main__:main"

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
